<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="main.css">
    <title>FrostByte Games</title>
    <link rel="icon" type="image/x-icon" href="Def.png">
</head>

<body>

<header class="header">
    <a href="index.html" class="logo">
        <div class="logo-img"></div>
        <h1>FrostByte Games</h1>
    </a>
    <nav class="top-nav">
        <a href="store.html">Store</a>
        <a href="support.html">Support</a>
        <a href="checkout.html">Checkout</a>
    </nav>
</header>

<div class="content">

    <h2 class="section-title">Your Cart</h2>

    <div id="cart-items" style="max-width:600px;margin:auto;"></div>

    <h3 id="total" style="text-align:center;color:var(--accent);margin-top:20px;"></h3>

    <div style="text-align:center;margin-top:30px;">
        <a href="payment.html" class="buy">Go to Checkout</a>
    </div>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let container = document.getElementById("cart-items");
let total = 0;

function updateCart() {
    container.innerHTML = "";
    total = 0;

    cart.forEach((item, index) => {
        total += item.price;

        container.innerHTML += `
            <div style="background:#151515;padding:20px;margin-bottom:15px;border-radius:10px;">
                <img src="${item.img}" style="height:120px;object-fit:cover;border-radius:6px;">
                <h3 style="color:var(--accent);margin-top:10px;">${item.name}</h3>
                <p style="color:#ccc;">$${item.price.toFixed(2)}</p>
                <button onclick="removeItem(${index})"
                    style="margin-top:10px;padding:8px 12px;background:#ff3b3b;color:white;border:none;border-radius:6px;cursor:pointer;">
                    Remove
                </button>
            </div>
        `;
    });

    document.getElementById("total").innerText = "Total: $" + total.toFixed(2);
}

function removeItem(index) {
    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    updateCart();
}

updateCart();
</script>

</body>
</html>
